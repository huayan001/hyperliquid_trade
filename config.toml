# Hyperliquid 永续合约机器人 — 默认配置（v1.1）
# 环境变量可覆盖同名项。密钥只能走环境变量，不要写进本文件。

symbols = ["BTC", "ETH", "SOL", "HYPE"]
network = "mainnet"          # mainnet | testnet
dry_run = true
paper_equity = 477.0
poll_seconds = 900
info_request_gap = 0.8   # /info 请求最小间隔秒
symbol_gap_seconds = 3.0 # 标的之间间隔秒
state_path = "state/paper_state.json"

[regime]
# 日线 ADX 超过该值才视为「趋势明确」（文档 20~25 的中间偏明确一侧）
clear_trend_adx = 22.5
# 日线 ADX 低于该值不算趋势，避免 20 附近中间地带误开趋势仓
trend_adx_min = 20.0
# 1h ADX 低于该值才考虑均值回归
mr_adx_max = 20.0
# 区间结构回看小时数（文档 8–12）
range_lookback_hours = 12
range_touch_frac = 0.20

[trend]
ema_fast = 20
ema_slow = 50
adx_period = 14
adx_exit = 15.0
btc_short_adx_min = 25.0
donchian_period = 20
atr_period = 14
stop_atr = 2.0
trail_step_atr = 1.0
trail_offset_atr = 0.5
chase_body_atr = 1.5
chase_symbols = ["BTC"]
risk_pct = 0.02               # 单笔风险 2% 权益
btc_short_risk_mult = 0.7
max_positions = 2
portfolio_risk_max = 0.04
daily_loss_delever = 0.05
weekly_loss_delever = 0.10
funding_annual_warn = 0.50
# 高资金费时仓位下调系数（不做马丁，只缩小）
funding_size_mult = 0.5
# 趋势持仓默认不因资金费飙升自动离场（文档是「重新评估」）。需要时可打开，阈值独立且更高
funding_exit_enabled = false
funding_annual_exit = 2.0
# 金字塔加仓（文档 2.4 可选进阶）：浮盈≥1×ATR 且趋势仍确认，加仓≤首仓 50%
pyramid_enabled = true
pyramid_min_atr = 1.0
pyramid_max_frac = 0.5
pyramid_skip_chase = true
pyramid_be_buffer_atr = 0.05
# 分层入场：日线趋势确认后先市价试探仓；4h Donchian 收盘突破再补剩余
starter_enabled = true
starter_frac = 0.35
# 空列表 = 所有趋势标的；可写成 ["BTC", "ETH"] 只对部分品种启用
starter_symbols = []

[mean_reversion]
bb_period = 20
bb_std = 2.0
rsi_period = 14
rsi_oversold = 30.0
rsi_overbought = 70.0
adx_period = 14
adx_max = 20.0
adx_kill = 25.0
atr_period = 14
stop_atr = 1.0
time_stop_hours = 5.0        # 文档 4–6 小时
partial_tp_frac = 0.5
risk_pct = 0.02               # 单笔风险 2% 权益（与趋势一致）
max_positions = 1
max_trades_per_symbol_day = 3
daily_loss_halt = 0.02
leverage_cap = 10
chase_body_atr = 1.5
bandwidth_high_rank = 0.80   # 近 20 期高位区
# 震荡/波段：逆向资金费年化 ≥ 本策略自己的阈值时可提前离场（不要复用 trend.funding_annual_warn）
funding_exit_enabled = true
funding_annual_exit = 0.50

[risk]
isolated = true
min_notional_usd = 10.0
target_leverage = 10
liq_buffer_frac = 0.50          # 止损距 ≤ (1/lev)*该系数，避免强平抢先

[risk.max_leverage]
BTC = 10
ETH = 10
SOL = 10
HYPE = 10
